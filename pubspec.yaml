name: msfatigue
description: 'A new Flutter project.'
publish_to: 'none'
version: 0.0.2+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  flutter_markdown: ^0.7.3+1
  rename_app: ^1.6.1
  solidpod: ^0.6.0
  window_manager: ^0.3.9
  universal_io: ^2.2.2

dev_dependencies:
  build_runner: ^2.4.12
  dart_code_metrics:
    git:
      url: https://github.com/anusii/dart-code-metrics.git
      ref: dev
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  integration_test:
    sdk: flutter

dependency_overrides:
  #  file: ^7.0.0 # Use only if necessary
  intl: ^0.19.0 # Use only if necessary
  collection: ^1.19.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/image.png
    - assets/markdown/fatigue_questionnaire.md
